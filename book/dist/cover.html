/* ============================================================
   «Красота изнутри» — вёрстка книги. Veniva / Natali Konrad
   ============================================================ */

@page { size: 148mm 210mm; margin: 16mm 15mm 17mm; }

:root {
  --paper:  #FAF7F2;
  --ink:    #1A1614;
  --soft:   #5C534C;
  --gold:   #B5A080;
  --gold-d: #8F7C5E;
  --line:   #E2DACF;
  --dark:   #151210;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'DM Sans', -apple-system, sans-serif;
  font-size: 10.4pt;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Обложка (отдельный PDF, без полей) ---------- */

.cover {
  width: 148mm; height: 210mm;
  background: var(--dark);
  color: var(--paper);
  padding: 26mm 18mm;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative; overflow: hidden;
}
.cover::after {
  content: ''; position: absolute;
  left: -30mm; top: 96mm; width: 120mm; height: 120mm; border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, rgba(181,160,128,.20), rgba(181,160,128,0) 68%);
}
.cover-top, .cover-mid, .cover-bottom { position: relative; z-index: 2; }
.cover-brand {
  font-size: 8pt; letter-spacing: .34em; text-transform: uppercase; color: var(--gold);
}
.cover-mid { margin-bottom: 8mm; }
.cover-rule { width: 26mm; height: 1px; background: var(--gold); margin-bottom: 9mm; }
.cover h1 {
  font-family: 'Cormorant', Georgia, serif; font-weight: 400;
  font-size: 40pt; line-height: 1.02; margin: 0 0 7mm;
}
.cover h1 em { font-style: italic; color: var(--gold); }
.cover-sub { font-size: 9.6pt; line-height: 1.55; color: rgba(250,247,242,.62); max-width: 82mm; }
.cover-bottom { font-family: 'Cormorant', Georgia, serif; font-size: 14pt; letter-spacing: .06em; }
.cover-bottom span {
  display: block; font-family: 'DM Sans', sans-serif; font-size: 7.6pt;
  letter-spacing: .28em; text-transform: uppercase; color: var(--gold-d); margin-top: 2.5mm;
}

/* ---------- Внутренний блок ---------- */

.frontmatter, .part-divider, .chapter { break-before: page; }
.frontmatter:first-child { break-before: auto; }

.titlepage { text-align: center; padding-top: 46mm; }
.titlepage h1 {
  font-family: 'Cormorant', Georgia, serif; font-weight: 400;
  font-size: 30pt; line-height: 1.1; margin: 0 0 6mm;
}
.titlepage h1 em { font-style: italic; color: var(--gold-d); }
.titlepage .sub { color: var(--soft); font-size: 9.6pt; max-width: 88mm; margin: 0 auto; }
.titlepage .author {
  margin-top: 22mm; font-family: 'Cormorant', serif; font-size: 13pt; letter-spacing: .05em;
}

.toc h2 {
  font-family: 'Cormorant', Georgia, serif; font-weight: 400; font-size: 22pt; margin: 0 0 10mm;
}
.toc-part {
  font-size: 7.8pt; letter-spacing: .24em; text-transform: uppercase;
  color: var(--gold-d); margin: 8mm 0 3.5mm;
}
.toc-item {
  display: flex; gap: 4mm; padding: 1.6mm 0;
  border-bottom: 1px solid var(--line); font-size: 9.6pt;
}
.toc-num { font-family: 'Cormorant', serif; color: var(--gold-d); min-width: 7mm; font-size: 11pt; }

.part-divider {
  height: 178mm; display: flex; flex-direction: column;
  justify-content: center; text-align: center;
}
.part-divider .pd-num {
  font-family: 'Cormorant', Georgia, serif; font-size: 68pt; line-height: 1;
  color: var(--gold); margin-bottom: 4mm;
}
.part-divider .pd-title {
  font-family: 'Cormorant', Georgia, serif; font-size: 26pt; letter-spacing: .04em; margin-bottom: 6mm;
}
.part-divider .pd-rule { width: 18mm; height: 1px; background: var(--gold); margin: 0 auto 6mm; }
.part-divider .pd-note { color: var(--soft); font-size: 9.4pt; max-width: 78mm; margin: 0 auto; }

.chapter-head { margin-bottom: 9mm; }
.chapter-kicker {
  font-size: 7.6pt; letter-spacing: .26em; text-transform: uppercase;
  color: var(--gold-d); margin-bottom: 3mm;
}
.chapter h1 {
  font-family: 'Cormorant', Georgia, serif; font-weight: 400;
  font-size: 26pt; line-height: 1.12; margin: 0 0 4mm;
}
.chapter-rule { width: 14mm; height: 1px; background: var(--gold); }

h2 {
  font-family: 'Cormorant', Georgia, serif; font-weight: 600; font-size: 15pt;
  line-height: 1.25; margin: 8mm 0 3mm; break-after: avoid;
}
h3 {
  font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 10.2pt;
  margin: 6mm 0 2mm; break-after: avoid;
}
p { margin: 0 0 3.4mm; orphans: 2; widows: 2; }
.chapter-head + p::first-letter {
  font-family: 'Cormorant', Georgia, serif; font-size: 30pt; line-height: .82;
  float: left; padding: 1.5mm 2mm 0 0; color: var(--gold-d);
}
strong { font-weight: 600; }
a { color: var(--gold-d); text-decoration: none; }

ul, ol { margin: 0 0 3.6mm; padding-left: 5.5mm; }
li { margin-bottom: 1.4mm; }
ul li::marker { color: var(--gold); }
ol li::marker { color: var(--gold-d); font-weight: 600; }

table {
  width: 100%; border-collapse: collapse; margin: 5mm 0;
  font-size: 8.8pt; break-inside: avoid;
}
th {
  text-align: left; font-weight: 600; font-size: 7.6pt; letter-spacing: .1em;
  text-transform: uppercase; color: var(--gold-d);
  border-bottom: 1px solid var(--gold); padding: 2mm 2mm 1.6mm 0;
}
td { padding: 2mm 2mm 2mm 0; border-bottom: 1px solid var(--line); vertical-align: top; }

.callout { break-inside: avoid; margin: 5mm 0; padding: 4mm 5mm; font-size: 9.4pt; line-height: 1.55; }
.callout p:last-child { margin-bottom: 0; }
.callout .c-label {
  font-size: 7.4pt; letter-spacing: .22em; text-transform: uppercase;
  margin-bottom: 2mm; color: var(--gold-d);
}
.callout-note { background: #F3EEE6; border-left: 2px solid var(--gold); }
.callout-practice { background: var(--dark); color: var(--paper); border-radius: 1.5mm; }
.callout-practice .c-label { color: var(--gold); }
.callout-practice strong { color: #fff; }
.callout-personal { border: 1px dashed var(--gold); background: rgba(181,160,128,.07); color: var(--soft); }

blockquote {
  margin: 5mm 0; padding-left: 5mm; border-left: 2px solid var(--gold);
  font-family: 'Cormorant', Georgia, serif; font-size: 13pt; line-height: 1.4;
  font-style: italic; color: var(--gold-d);
}
hr { border: none; height: 1px; background: var(--line); margin: 7mm 0; }

@page{margin:0}</style>
</head><body>
<div class="cover">
  <div class="cover-top"><div class="cover-brand">VENIVA</div></div>
  <div class="cover-mid">
    <div class="cover-rule"></div>
    <h1>Красота <em>изнутри</em></h1>
    <div class="cover-sub">Опора, топливо, поверхность — система, в которой лицо начинается со стоп</div>
  </div>
  <div class="cover-bottom">Natali Konrad<span>2026</span></div>
</div></body></html>
